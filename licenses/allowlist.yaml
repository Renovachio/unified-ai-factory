schemaVersion: 1
# SPDX identifiers whose licenses are permitted for installed packages (direct and transitive).
allowedLicenses: [MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, Python-2.0, CC-BY-4.0]
# Metered model-inference SDKs: never allowed (SECURITY.md; AGENTS.md rule 3).
forbiddenPackages:
  - "@anthropic-ai/sdk"
  - "@anthropic-ai/bedrock-sdk"
  - "@anthropic-ai/vertex-sdk"
  - openai
  - "@google/generative-ai"
  - "@google/genai"
  - cohere-ai
  - "@mistralai/mistralai"
  - ai
  - langchain
  - "@langchain/openai"
  - "@langchain/anthropic"
# Paths excluded from the upstream-marker / SDK-import scan (the checker itself and its fixtures).
scanExclude:
  - "packages/checks/src/license/**"
  - "packages/checks/tests/**"
  - "scripts/license-check.ts"
