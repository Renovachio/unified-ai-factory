name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sandbox prerequisites (bubblewrap, unprivileged user namespaces)
        run: |
          sudo apt-get update -y && sudo apt-get install -y bubblewrap curl
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev /bin/true
      - run: bun install --frozen-lockfile
      - run: python3 scripts/validate_package.py
      - run: bun run license -- --sbom evidence/LIC-001/sbom.cdx.json
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
