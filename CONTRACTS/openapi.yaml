openapi: 3.1.0
info:
  title: Unified AI Factory Control API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /jobs:
    post:
      operationId: createJob
      security: [{ userSession: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './job-create.schema.json' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: './job-response.schema.json' }
        '400': { description: Invalid request }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '409': { description: Idempotency conflict }
    get:
      operationId: listJobs
      security: [{ userSession: [] }]
      responses:
        '200': { description: Cursor paginated jobs }
  /jobs/{jobId}:
    get:
      operationId: getJob
      security: [{ userSession: [] }]
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
      responses:
        '200': { description: Job details }
  /jobs/{jobId}/decisions:
    post:
      operationId: recordDecision
      security: [{ userSession: [] }]
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
      responses:
        '202': { description: SHA-bound approval recorded; not merged }
  /jobs/{jobId}/events/stream:
    get:
      operationId: streamJobEvents
      security: [{ userSession: [] }]
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
      responses:
        '200': { description: Reconnectable event stream }
components:
  securitySchemes:
    userSession:
      type: openIdConnect
      openIdConnectUrl: https://example.invalid/.well-known/openid-configuration
